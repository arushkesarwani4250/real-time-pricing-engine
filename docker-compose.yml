services:
  pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real_time_pricing_engine
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM_WS_URL=${UPSTREAM_WS_URL:-wss://v3-prod.livefxhub.com/ws/algo}
      - API_KEY=${API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=8080
      - LOG_LEVEL=info
      - MOCK_FEED=${MOCK_FEED:-false}
    volumes:
      # Persistent volume mount so rolling 24h state survives container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
